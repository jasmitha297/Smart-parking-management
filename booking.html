<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking | SmartPark</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="navbar"><div class="logo">SmartPark</div><nav><a href="index.html">Home</a><a href="parking.html">Parking</a><a class="active" href="booking.html">My Booking</a></nav></header>
<p>Available parking slots are displayed before booking.</p>
<main class="page narrow"><section class="card"><span class="badge">Parking Session</span><h1>Confirm Your Booking</h1><p id="slotSummary">No slot selected yet. Go to Parking to choose a slot.</p>
<p>Booking confirmation will be displayed here.</p>
<form id="bookingForm"><label for="vehicle">Vehicle Registration Number</label><input id="vehicle" name="vehicle" type="text" placeholder="e.g. KL 07 AB 1234" required>
<label for="duration">Expected Duration</label><select id="duration" name="duration"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option></select>
<div class="summary"><div><span>Selected Slot</span><strong id="selectedSlot">Not selected</strong></div><div><span>Estimated Fee</span><strong id="fee">₹40</strong></div></div>
<button class="btn primary full" type="submit">Confirm Booking</button></form><div id="confirmation" class="confirmation hidden"></div></section></main>
<script src="script.js"></script></body></html>
