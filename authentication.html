<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking - Authentication</title>
    <link rel="stylesheet" href="authentication.css">
</head>

<body>

    <div class="container">

        <h1>Smart Parking Management System</h1>

        <h2>Smart Parking User Authentication</h2>

        <input type="text" id="username" placeholder="Enter username" required minlength="3">

        <input type="password" id="password" placeholder="Enter password" required minlength="6">

        <button onclick="login()">Login to Parking</button>

        <button onclick="register()">Register</button>

        <p id="message"></p>

    </div>

    <script src="authentication.js"></script>

</body>
</html>
